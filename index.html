<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102732">
  <meta name="description" content="Houd alle kosten en vergoedingen van je Ford Focus bij. Ook offline.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Focus Autokosten</title>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></symbol>
    <symbol id="i-fuel" viewBox="0 0 24 24"><path d="M4 21h12M6 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M6 11h10M9 7h4"/><path d="M16 8h2l3 3v7a2 2 0 0 1-4 0v-4"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a5 5 0 0 0-6.6 6.6l-5.1 5.1a2 2 0 0 0 2.8 2.8l5.1-5.1a5 5 0 0 0 6.6-6.6L14 12l-3-3z"/></symbol>
    <symbol id="i-road" viewBox="0 0 24 24"><path d="M7 3 3 21M17 3l4 18M12 3v4m0 4v4m0 4v2"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="m5 10 2-5h10l2 5M3 10h18v8H3zM5 18v3m14-3v3M7 14h.01M17 14h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-5 6h2"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 17 9 11l4 4 8-9"/><path d="M15 6h6v6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-.9L20 7.6 16.4 4 4.9 15.5zM14 6.5l3.5 3.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16m-14 0 1 14h10l1-14M9 7V4h6v3m-5 4v6m4-6v6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg class="icon"><use href="#i-car"/></svg></div>
        <div class="brand-name">focus<span>.</span><small>AUTOKOSTEN</small></div>
      </div>
      <div class="sidebar-caption">MIJN AUTO</div>
      <nav class="side-nav" aria-label="Hoofdnavigatie">
        <button class="nav-link is-active" data-page="dashboard"><svg class="icon"><use href="#i-home"/></svg><span>Overzicht</span></button>
        <button class="nav-link" data-page="fuel"><svg class="icon"><use href="#i-fuel"/></svg><span>Tankbeurten</span></button>
        <button class="nav-link" data-page="expenses"><svg class="icon"><use href="#i-wrench"/></svg><span>Uitgaven</span></button>
        <button class="nav-link" data-page="income"><svg class="icon"><use href="#i-road"/></svg><span>Vergoedingen</span></button>
        <button class="nav-link" data-page="car"><svg class="icon"><use href="#i-car"/></svg><span>Mijn auto</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-car-icon"><svg class="icon"><use href="#i-car"/></svg></div>
        <div><strong id="sideCarName">Ford Focus</strong><span id="sideCarSub">Bouwjaar 2004</span></div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">MIJN GARAGE <span>/</span> <strong id="breadcrumbText">Overzicht</strong></div>
        <div class="topbar-right"><span class="save-status"><span class="status-dot"></span> Opgeslagen op dit apparaat</span><button class="btn btn-dark btn-sm" id="newEntryTop"><svg class="icon"><use href="#i-plus"/></svg><span>Nieuwe boeking</span></button></div>
      </header>
      <main id="appContent" tabindex="-1"></main>
      <footer class="footer">FOCUS AUTOKOSTEN <span>•</span> Jouw gegevens blijven op dit apparaat. Maak geregeld een back-up.</footer>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Mobiele navigatie">
    <button class="mobile-nav-link is-active" data-page="dashboard"><svg class="icon"><use href="#i-home"/></svg><span>Overzicht</span></button>
    <button class="mobile-nav-link" data-page="fuel"><svg class="icon"><use href="#i-fuel"/></svg><span>Tanken</span></button>
    <button class="mobile-nav-link" data-page="expenses"><svg class="icon"><use href="#i-wrench"/></svg><span>Uitgaven</span></button>
    <button class="mobile-nav-link" data-page="income"><svg class="icon"><use href="#i-road"/></svg><span>Vergoeding</span></button>
    <button class="mobile-nav-link" data-page="car"><svg class="icon"><use href="#i-car"/></svg><span>Auto</span></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
